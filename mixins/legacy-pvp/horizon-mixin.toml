cancellable = true
target = "horizon_client::game::remote::Game<'_>::send"
helper = "send.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "packet", ty = "&S", value = "&packet" },
]

